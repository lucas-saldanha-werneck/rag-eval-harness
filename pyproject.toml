[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "Tiny offline harness: score a retriever against a golden question set (Recall@k, MRR) and list the misses."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rag-eval = "rag_eval_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
